<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - YouDrive</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="homepage.html">YouDrive</a>
      <nav class="nav-links">
        <a href="homepage.html">Home</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <section class="section-card" style="max-width: 520px; margin: 40px auto;">
      <div class="section-title">
        <div>
          <h2>Create your account</h2>
          <p>Register as a user or admin to access the YouDrive platform.</p>
        </div>
      </div>

      <form id="register-form" class="form-card">
        <div class="field-group">
          <label for="register-name">Name</label>
          <input type="text" id="register-name" name="name" placeholder="Your full name" required />
        </div>
        <div class="field-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="field-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" name="password" placeholder="Create a password" required />
        </div>
        <div class="field-group">
          <label for="register-password-confirm">Confirm password</label>
          <input type="password" id="register-password-confirm" name="passwordConfirm" placeholder="Confirm your password" required />
        </div>
        <div class="field-group">
          <label for="register-role">Role</label>
          <select id="register-role" name="role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button class="button-primary button" type="submit">Register</button>
        <p class="small-text" style="margin-top: 14px;">Already registered? <a href="login.html">Login here</a>.</p>
        <div id="register-message" class="form-message"></div>
      </form>
    </section>
  </div>

  <script src="auth.js"></script>
</body>
</html>
